name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache SunVox library
        uses: actions/cache@v4
        with:
          path: var/sunvox_lib-2.1.4d.zip
          key: sunvox-lib-2.1.4d-abe851de9d65a10e06673bf33257154591a2ff63ad2bb298488a5941cc5f4057

      - name: Install SunVox library
        run: sh scripts/install_sunvox_lib.sh

      - name: Build generated assets
        run: npm run generated:build

      - name: Check license notices
        run: npm run licenses:check

      - name: Check SunVox lib compatibility
        run: npm run sunvox:lib:check

      - name: Test
        run: npm test

      - name: Install browser debug dependencies
        run: npm ci
        working-directory: tools/browser-debug

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tools/browser-debug

      - name: Check mobile synth tap
        run: npm run browser:check:synth:mobile

      - name: Check SunVox DB
        run: npm run sunvox:inspect -- check

      - name: Check SunVox controller metadata
        run: npm run sunvox:controller-diff

      - name: Check SunVox coverage
        run: npm run sunvox:coverage:check

      - name: Verify SunVox samples
        run: npm run sunvox:verify:all

  deploy:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache SunVox library
        uses: actions/cache@v4
        with:
          path: var/sunvox_lib-2.1.4d.zip
          key: sunvox-lib-2.1.4d-abe851de9d65a10e06673bf33257154591a2ff63ad2bb298488a5941cc5f4057

      - name: Install SunVox library
        run: sh scripts/install_sunvox_lib.sh

      - name: Build
        run: npm run build

      - name: Check built license notices
        run: npm run licenses:check:dist

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
          fi

      - name: Deploy Worker and static assets
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-site
          path: dist

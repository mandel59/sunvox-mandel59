<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SunVox Projects は移転しました</title>
  <link rel="canonical" href="https://sunvox-projects.ryusei.dev/">
  <script>
    const destination = new URL('https://sunvox-projects.ryusei.dev/');
    const prefix = '/sunvox-mandel59';
    const path = location.pathname;
    if (path === prefix || path.startsWith(`${prefix}/`)) {
      destination.pathname = path.slice(prefix.length) || '/';
    }
    if (destination.pathname === '/index.html') destination.pathname = '/';
    destination.search = location.search;
    destination.hash = location.hash;
    location.replace(destination.href);
    addEventListener('DOMContentLoaded', () => {
      const link = document.getElementById('destination');
      link.href = destination.href;
    });
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://sunvox-projects.ryusei.dev/"></noscript>
</head>
<body>
  <p>SunVox Projects は移転しました。</p>
  <p><a id="destination" href="https://sunvox-projects.ryusei.dev/">新しいサイトを開く</a></p>
</body>
</html>
